# R15K Arcade – the four platform builds: Android (AAB, one APK per ABI, emulator smoke), iOS (simulator
# build and smoke), macOS (universal DMG) and Windows (NSIS setup and MSIX). Reusable workflow, called by
# ci.yml (mode pr, every pull request and push to main) and release-please.yml (mode release, after a
# release was created); it never gets secrets, so every package is unsigned (Android is signed later in
# release-please.yml, the MSIX by the Store; macOS is ad-hoc signed). Artifacts belong to the calling run.
# Audio: in pr mode the caller's checks job has already uploaded rendered-audio; in release mode the audio
# job renders it first. Native projects are generated by the Tauri CLI in every run and patched by
# tools/src/platform-patch (ADR 0002); their unpatched anchor files are uploaded for refreshing the patch
# fixtures. Lint, verify, size and smoke steps keep running after a failure so one run shows everything.
name: Platform builds

on:
  workflow_call:
    inputs:
      mode:
        description: pr (pull requests and main) or release (after release-please created a release)
        type: string
        required: true

permissions:
  contents: read

env:
  NDK_VERSION: '27.3.13750724'
  BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_SMOKE_IMAGE: 'system-images;android-34;google_apis;x86_64'
  XCODE_APP: '/Applications/Xcode_26.6.app'
  # renovate: datasource=github-releases depName=ktlint/ktlint
  KTLINT_VERSION: '1.8.0'
  KTLINT_SHA256: 'a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75'
  # renovate: datasource=github-releases depName=yonaskolb/XcodeGen
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'

jobs:
  audio:
    name: audio
    if: inputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, pnpm (Corepack), dependencies
        uses: ./.github/actions/setup-workspace

      - name: Song and SFX render
        run: pnpm run assets

      - name: Rendered audio for the builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-audio
          path: apps/arcade/public/audio
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  build-android:
    name: build-android
    needs: audio
    if: ${{ !cancelled() && needs.audio.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, pnpm (Corepack), dependencies
        uses: ./.github/actions/setup-workspace

      - name: Rendered audio of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-audio
          path: apps/arcade/public/audio

      - name: Rust toolchain with the Android targets, Cargo.lock bootstrap, cargo cache
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cache-key: android
          cache-target: 'false'

      - name: JDK 17, Android NDK and build-tools, Gradle cache
        id: android
        uses: ./.github/actions/setup-android

      # the plugin sources live outside gen/android, so the generated project's .editorconfig never applies
      - name: ktlint (pinned, SHA-256 verified) on our Kotlin
        run: |
          bash .github/scripts/download-tool.sh ktlint "$KTLINT_VERSION" "$KTLINT_SHA256"
          "$RUNNER_TEMP/bin/ktlint" --editorconfig=.editorconfig 'plugins/**/*.kt' 'plugins/**/*.kts'

      - name: Generate and patch the Android project (tauri android init, icons, platform-patch)
        id: prepare
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.android.outcome == 'success' }}
        run: pnpm run native:prepare --platform android

      - name: Unpatched generated files (for refreshing the patch fixtures)
        if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-generated
          path: .tmp/native-generated/android
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      # --split-per-abi splits AABs as well, so the universal AAB and the per-ABI APKs are two builds;
      # the second one reuses the compiled Rust libraries.
      - name: Release builds (universal AAB, one APK per ABI; unsigned)
        id: build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          pnpm run tauri android build --ci --aab --target aarch64 armv7 i686 x86_64
          pnpm run tauri android build --ci --apk --split-per-abi --target aarch64 armv7 i686 x86_64

      - name: Collect the packages
        id: packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          outputs=apps/arcade/src-tauri/gen/android/app/build/outputs
          mkdir -p .tmp/android-packages
          find "$outputs/apk" -type f -name '*-release*.apk' -exec cp {} .tmp/android-packages/ \;
          find "$outputs/bundle" -type f -name '*-release*.aab' -exec cp {} .tmp/android-packages/ \;
          ls -l .tmp/android-packages
          apk="$(find .tmp/android-packages -type f -name '*x86_64*.apk' -print -quit)"
          aab="$(find .tmp/android-packages -type f -name '*.aab' -print -quit)"
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "::error::x86_64 APK or AAB missing in $outputs"
            exit 1
          fi
          echo "smoke-apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - name: Android packages (unsigned)
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-packages
          path: .tmp/android-packages
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Manifest flags and the kept device plugin (x86_64 APK)
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        env:
          APK: ${{ steps.packages.outputs.smoke-apk }}
        run: >-
          node tools/src/platform-patch/main.ts verify --platform android
          --aapt2 "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" --apk "$APK"

      - name: Size budgets (AAB, APK per ABI)
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        env:
          AAB: ${{ steps.packages.outputs.aab }}
        run: |
          pnpm run size-budget --aab "$AAB"
          for apk in .tmp/android-packages/*.apk; do
            pnpm run size-budget --apk "$apk"
          done

      - name: Emulator system image location
        id: avd
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: echo "path=$ANDROID_HOME/${ANDROID_SMOKE_IMAGE//;//}" >> "$GITHUB_OUTPUT"

      - name: Emulator system image from the cache
        if: ${{ !cancelled() && steps.avd.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.avd.outputs.path }}
          key: avd-image-v1-${{ env.ANDROID_SMOKE_IMAGE }}

      - name: Emulator smoke (start, device plugin during a round, no crash)
        id: smoke
        if: ${{ !cancelled() && steps.avd.outcome == 'success' }}
        env:
          APK: ${{ steps.packages.outputs.smoke-apk }}
        run: bash .github/scripts/android-smoke.sh "$APK" .tmp/android-smoke

      - name: Smoke screenshots and logcat
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke
          path: .tmp/android-smoke
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  build-ios:
    name: build-ios
    needs: audio
    if: ${{ !cancelled() && needs.audio.result != 'failure' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, pnpm (Corepack), dependencies
        uses: ./.github/actions/setup-workspace

      - name: Rendered audio of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-audio
          path: apps/arcade/public/audio

      - name: Xcode (pinned)
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      # with xcodegen on PATH, tauri ios init does not install it through Homebrew
      - name: XcodeGen (pinned, SHA-256 verified)
        id: xcodegen
        run: bash .github/scripts/download-tool.sh xcodegen "$XCODEGEN_VERSION" "$XCODEGEN_SHA256"

      - name: Rust toolchain with the iOS targets, Cargo.lock bootstrap, cargo cache
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim
          cache-key: ios

      - name: swift-format (bundled with the pinned Xcode) on our Swift
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        run: xcrun swift-format lint --strict --recursive plugins/device/ios

      - name: Generate and patch the iOS project (tauri ios init, icons, platform-patch)
        id: prepare
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.xcodegen.outcome == 'success' }}
        run: pnpm run native:prepare --platform ios

      - name: Unpatched generated files (for refreshing the patch fixtures)
        if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-generated
          path: .tmp/native-generated/ios
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      # tauri::generate_context! reads dist when the app crate compiles; the audio is already in place
      - name: Web build (dist for the Rust compile)
        id: web
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm --filter @r15k/arcade run build

      - name: cargo clippy for the iOS simulator (app and plugin, incl. the Swift package)
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: >-
          cargo clippy --manifest-path apps/arcade/src-tauri/Cargo.toml --workspace
          --target aarch64-apple-ios-sim --lib --locked -- -D warnings

      - name: Simulator build (debug)
        id: build
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: pnpm run tauri ios build --ci --debug --target aarch64-sim

      - name: Locate the simulator app
        id: app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          app=''
          while IFS= read -r candidate; do
            bundle_id="$(plutil -extract CFBundleIdentifier raw "$candidate/Info.plist" 2> /dev/null || true)"
            platform="$(plutil -extract DTPlatformName raw "$candidate/Info.plist" 2> /dev/null || true)"
            if [ "$bundle_id" = 'dev.r15k.arcade' ] && [ "$platform" = 'iphonesimulator' ]; then
              app="$candidate"
              break
            fi
          done < <(find apps/arcade/src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d -name '*.app' -prune 2> /dev/null || true)
          if [ -z "$app" ]; then
            echo "::error::no simulator app for dev.r15k.arcade found"
            exit 1
          fi
          echo "simulator app: $app"
          echo "path=$app" >> "$GITHUB_OUTPUT"

      - name: Info.plist flags of the built app
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        env:
          APP: ${{ steps.app.outputs.path }}
        run: node tools/src/platform-patch/main.ts verify --platform ios --app "$APP"

      - name: Zip the simulator app
        id: zip
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        env:
          APP: ${{ steps.app.outputs.path }}
        run: |
          mkdir -p .tmp/ios-simulator-app
          ditto -c -k --keepParent "$APP" .tmp/ios-simulator-app/r15k-arcade-simulator.zip

      - name: Simulator app
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: .tmp/ios-simulator-app
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Simulator smoke (launch, still running after 20 s, no crash report)
        id: smoke
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        env:
          APP: ${{ steps.app.outputs.path }}
        run: bash .github/scripts/ios-smoke.sh "$APP" .tmp/ios-smoke

      - name: Smoke screenshot and log
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-smoke
          path: .tmp/ios-smoke
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  build-macos:
    name: build-macos
    needs: audio
    if: ${{ !cancelled() && needs.audio.result != 'failure' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, pnpm (Corepack), dependencies
        uses: ./.github/actions/setup-workspace
        with:
          cache: save

      - name: Rendered audio of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-audio
          path: apps/arcade/public/audio

      - name: Xcode (pinned, the same as the iOS build)
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Rust toolchain with both macOS targets, Cargo.lock bootstrap, cargo cache
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
          cache-key: macos
          cache-target: 'false'

      - name: Icons
        run: pnpm run icons

      - name: Universal release build (app and DMG, ad-hoc signed)
        run: pnpm run tauri build --ci --target universal-apple-darwin --bundles app,dmg

      - name: Collect the app and the DMG
        id: bundle
        run: |
          bundle=apps/arcade/src-tauri/target/universal-apple-darwin/release/bundle
          app="$(find "$bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$app" ] || [ -z "$dmg" ]; then
            echo "::error::app or DMG missing in $bundle"
            exit 1
          fi
          version="$(node -p "require('./apps/arcade/src-tauri/tauri.conf.json').version")"
          mkdir -p .tmp/macos-dmg
          cp "$dmg" ".tmp/macos-dmg/r15k-arcade_${version}_universal.dmg"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "dmg=.tmp/macos-dmg/r15k-arcade_${version}_universal.dmg" >> "$GITHUB_OUTPUT"

      - name: macOS DMG
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: .tmp/macos-dmg
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Info.plist flags of the built app
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          APP: ${{ steps.bundle.outputs.app }}
        run: node tools/src/platform-patch/main.ts verify --platform macos --app "$APP"

      - name: Size budget (DMG)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          DMG: ${{ steps.bundle.outputs.dmg }}
        run: pnpm run size-budget --dmg "$DMG"

  build-windows:
    name: build-windows
    needs: audio
    if: ${{ !cancelled() && needs.audio.result != 'failure' }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, pnpm (Corepack), dependencies
        uses: ./.github/actions/setup-workspace
        with:
          cache: save

      - name: Rendered audio of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-audio
          path: apps/arcade/public/audio

      - name: Rust toolchain (host target), Cargo.lock bootstrap, cargo cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: windows
          cache-target: 'false'

      - name: Icons
        run: pnpm run icons

      - name: Release build (NSIS setup, unsigned)
        run: pnpm run tauri build --ci --bundles nsis

      - name: Collect the NSIS setup
        id: nsis
        run: |
          shopt -s nullglob
          setups=(apps/arcade/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#setups[@]}" -ne 1 ]; then
            echo "::error::expected one NSIS setup, found ${#setups[@]}"
            exit 1
          fi
          version="$(node -p "require('./apps/arcade/src-tauri/tauri.conf.json').version")"
          mkdir -p .tmp/windows-nsis
          cp "${setups[0]}" ".tmp/windows-nsis/r15k-arcade_${version}_x64-setup.exe"

      - name: Windows NSIS setup
        if: ${{ !cancelled() && steps.nsis.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nsis
          path: .tmp/windows-nsis
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: MSIX (makeappx, unsigned; the Store signs it)
        id: msix
        if: ${{ !cancelled() && steps.nsis.outcome == 'success' }}
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: pwsh -NoProfile -File .github/scripts/msix-pack.ps1 -OutDir .tmp/windows-msix

      - name: Windows MSIX
        if: ${{ !cancelled() && steps.msix.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msix
          path: .tmp/windows-msix
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Size budget (MSIX)
        if: ${{ !cancelled() && steps.msix.outcome == 'success' }}
        run: |
          shopt -s nullglob
          for msix in .tmp/windows-msix/*.msix; do
            pnpm run size-budget --msix "$msix"
          done
