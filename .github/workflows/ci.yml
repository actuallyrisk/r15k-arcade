# R15K Arcade – CI: checks (exactly `pnpm verify`, step by step), E2E, and all four platform builds on
# every pull request, push to main and manual dispatch. No secrets; only actions/*; downloaded tools are
# SHA-256 verified. Checks keep running after a failure so one run shows everything.
# e2e and the platform builds wait for checks but need only its rendered audio (audio-ready), so a lint
# or test failure never hides a build failure. Reports are uploaded only on failure (7 days), packages
# and the E2E screenshots for the visual check always (14 days). Required checks on main: checks, e2e,
# platforms / build-android, platforms / build-ios, platforms / build-macos, platforms / build-windows
# and pr-title (pr-title.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same pull request cancels the running checks; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: 'v0.11.0'
  SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # e2e and the platform builds need only the rendered audio, not a fully green checks job
      audio-ready: ${{ steps.assets.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, pnpm (Corepack), dependencies
        id: setup
        uses: ./.github/actions/setup-workspace
        with:
          cache: save

      # tool, library and toolchain steps do not depend on each other, so one failure hides nothing
      - name: Lint and secret-scan tools (pinned, SHA-256 verified)
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/download-tool.sh actionlint "$ACTIONLINT_VERSION" "$ACTIONLINT_SHA256"
          bash .github/scripts/download-tool.sh shellcheck "$SHELLCHECK_VERSION" "$SHELLCHECK_SHA256"
          bash .github/scripts/download-tool.sh gitleaks "$GITLEAKS_VERSION" "$GITLEAKS_SHA256"

      - name: Linux libraries for compiling Tauri (clippy)
        if: ${{ !cancelled() }}
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
          libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev

      - name: Rust toolchain, Cargo.lock bootstrap, cargo cache
        id: rust
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-rust
        with:
          cache-key: checks

      # one step per verify step id, the same commands as locally
      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step typecheck

      - name: ESLint
        id: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step lint

      - name: Prettier
        id: format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step format

      - name: To-do markers (todo-check)
        id: todo-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step todo-check

      - name: Unit tests, replays, pixel snapshots (coverage gates)
        id: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step test

      - name: sprite-check
        id: sprite-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step sprite-check

      - name: i18n-check
        id: i18n-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step i18n-check

      - name: Song and SFX render
        id: assets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step assets

      - name: Web build
        id: build
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: pnpm run verify --ci --step build

      - name: Size budgets (web)
        id: size-budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run verify --ci --step size-budget

      - name: Licence report and dependency policy (JS + Rust)
        id: licences
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: pnpm run verify --ci --step licences

      - name: Icons
        id: icons
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step icons

      - name: actionlint + shellcheck
        id: actionlint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step actionlint

      - name: gitleaks (working tree)
        id: gitleaks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run verify --ci --step gitleaks

      - name: cargo fmt
        id: cargo-fmt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: pnpm run verify --ci --step cargo-fmt

      # clippy compiles the app crate, whose tauri::generate_context! reads dist and the icons
      - name: cargo clippy
        id: clippy
        if: >-
          ${{ !cancelled() && steps.rust.outcome == 'success' && steps.build.outcome == 'success' &&
          steps.icons.outcome == 'success' }}
        run: pnpm run verify --ci --step clippy

      - name: Rendered audio for E2E and builds
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-audio
          path: apps/arcade/public/audio
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Cargo.lock bootstrap (only while it is not committed)
        if: ${{ !cancelled() && steps.rust.outputs.lock-generated == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: apps/arcade/src-tauri/Cargo.lock
          retention-days: 7
          if-no-files-found: error

      - name: Reports on failure (coverage, snapshot diffs, size, licences)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports
          path: .tmp
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.audio-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, pnpm (Corepack), dependencies
        uses: ./.github/actions/setup-workspace

      - name: Rendered audio from the checks job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-audio
          path: apps/arcade/public/audio

      - name: Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter @r15k/arcade exec playwright --version | awk '{print $2}')"
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Playwright browsers from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Chromium and WebKit with their system libraries
        run: pnpm --filter @r15k/arcade exec playwright install --with-deps chromium webkit

      - name: E2E (every reference viewport in Chromium and WebKit)
        run: pnpm run test:e2e

      - name: Screenshots for the visual check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screens
          path: .tmp/e2e-screens
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            .tmp/playwright-report
            .tmp/playwright-results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  platforms:
    name: platforms
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.audio-ready == 'true' }}
    uses: ./.github/workflows/build-platforms.yml
    with:
      mode: pr
