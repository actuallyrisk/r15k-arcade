# R15K Arcade – releases. On every push to main the pinned release-please CLI (root dev dependency, no
# third-party action) first creates the GitHub Release of a merged release PR and then opens or updates
# the next release PR. It runs with the owner's fine-grained token AUTOMATION_TOKEN (environment
# automation), so release PRs, tags and releases are the owner's and release PRs trigger CI. After a new
# release: all four platforms are built in release mode (build-platforms.yml, no secrets), the APKs and the
# AAB are signed with the upload key (environment android-release), the sideload packages are attached
# to the release as the owner, and the store jobs report what they would upload. Every job whose
# secrets are missing ends with a ::notice:: and succeeds. The workflow's own GITHUB_TOKEN stays
# read-only: every write uses the owner's token.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# releases are never cancelled; a second push waits for the running release
concurrency:
  group: release-please
  cancel-in-progress: false

env:
  BUILD_TOOLS_VERSION: '36.0.0'

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: automation
    env:
      HAS_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Token gate
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::release-please skipped (AUTOMATION_TOKEN missing)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node, pnpm (Corepack), root package only (release-please)
        if: env.HAS_TOKEN == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          install: --filter r15k-arcade

      - name: Version of the manifest and whether its release exists already
        id: version
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          existed=false
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            existed=true
          fi
          echo "version $version, release v$version exists: $existed"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "existed=$existed" >> "$GITHUB_OUTPUT"

      - name: GitHub Release of a merged release PR
        if: env.HAS_TOKEN == 'true'
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: >-
          pnpm exec release-please github-release --token "$AUTOMATION_TOKEN"
          --repo-url "$GITHUB_REPOSITORY" --config-file release-please-config.json
          --manifest-file .release-please-manifest.json

      - name: Whether a release was created now
        id: release
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          EXISTED: ${{ steps.version.outputs.existed }}
        run: |
          released=false
          if [ "$EXISTED" = 'false' ] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            released=true
          fi
          echo "released: $released"
          echo "released=$released" >> "$GITHUB_OUTPUT"

      # release-please comments on the merged release PR with a fixed text of its own (no option turns it
      # off); this replaces it with a plain sentence and never fails the release
      - name: Release comment in our own words
        if: env.HAS_TOKEN == 'true' && steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          skip() {
            echo "::notice::no release comment to rewrite"
            exit 0
          }
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --head release-please--branches--main \
            --limit 1 --json number --jq '.[0].number // empty')" || skip
          [ -n "$pr" ] || skip
          url="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" || skip
          ids="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq '.[] | select(.body | contains("Created releases:")) | .id')" || skip
          [ -n "$ids" ] || skip
          while IFS= read -r id; do
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -f body="Released as [v$VERSION]($url)." > /dev/null || skip
            echo "rewrote comment $id on #$pr"
          done <<< "$ids"

      - name: Release PR
        if: env.HAS_TOKEN == 'true'
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: >-
          pnpm exec release-please release-pr --token "$AUTOMATION_TOKEN"
          --repo-url "$GITHUB_REPOSITORY" --config-file release-please-config.json
          --manifest-file .release-please-manifest.json

  build:
    name: build
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/build-platforms.yml
    with:
      mode: release

  sign-android:
    name: sign-android
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release
    env:
      HAS_KEYSTORE: >-
        ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' &&
        secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Signing gate
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::Android signing skipped (secrets missing)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEYSTORE == 'true'
        with:
          persist-credentials: false

      - name: Unsigned Android packages of this release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-packages
          path: .tmp/android-packages

      - name: JDK 17 and build-tools
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION" > /dev/null

      - name: Sign APKs and AAB with the upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          bash .github/scripts/sign-android.sh .tmp/android-packages .tmp/android-signed "$VERSION"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Signed Android packages
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-signed
          path: .tmp/android-signed
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish
    needs: [release-please, build, sign-android]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: automation
    env:
      HAS_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
    steps:
      - name: Token gate
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::publish skipped (AUTOMATION_TOKEN missing)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false

      - name: macOS DMG of this release
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: .tmp/release/macos-dmg

      - name: Windows NSIS setup of this release
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-nsis
          path: .tmp/release/windows-nsis

      # a pattern instead of a name: android-signed is missing while the signing secrets are, which
      # release-upload.sh reports with a notice
      - name: Signed APKs of this release (when signed)
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-signed
          path: .tmp/release/android-signed

      - name: Attach to the GitHub Release
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bash .github/scripts/release-upload.sh "$VERSION" .tmp/release

  store-play:
    name: store-play
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: play
    env:
      HAS_SECRETS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Play internal track
        run: |
          if [ "$HAS_SECRETS" != 'true' ]; then
            echo "::notice::Play upload skipped (PLAY_SERVICE_ACCOUNT_JSON missing)"
          else
            echo "::notice::Play upload arrives in M6"
          fi

  store-msstore:
    name: store-msstore
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: msstore
    env:
      HAS_SECRETS: >-
        ${{ secrets.MSSTORE_TENANT_ID != '' && secrets.MSSTORE_CLIENT_ID != '' &&
        secrets.MSSTORE_CLIENT_SECRET != '' && secrets.MSSTORE_SELLER_ID != '' &&
        secrets.MSSTORE_PRODUCT_ID != '' }}
    steps:
      - name: Microsoft Store submission
        run: |
          if [ "$HAS_SECRETS" != 'true' ]; then
            echo "::notice::Microsoft Store upload skipped (MSSTORE_* secrets missing)"
          else
            echo "::notice::Microsoft Store upload arrives in M6"
          fi

  store-apple:
    name: store-apple
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: apple
    env:
      HAS_SECRETS: >-
        ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERTIFICATE_P12_BASE64 != '' &&
        secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' &&
        secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - name: TestFlight upload
        run: |
          if [ "$HAS_SECRETS" != 'true' ]; then
            echo "::notice::TestFlight upload skipped (APPLE_* secrets missing)"
          else
            echo "::notice::TestFlight upload arrives in M6"
          fi
