# R15K Arcade – gitleaks configuration: the built-in rules and allowlists, plus paths that never hold our
# own secrets. `gitleaks dir` (CI checks job, `pnpm verify --step gitleaks`) does not read .gitignore, so
# dependencies and build output are listed here; `gitleaks git` (security-weekly.yml) scans the full
# history. Patterns are Go regular expressions matched against repository-relative paths; directory
# patterns also match the directory itself, so the scan never descends into it.
title = "R15K Arcade"

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures copied from generated projects, lockfiles, dependencies and build output"
paths = [
  # verbatim copies of files the Tauri CLI generates (platform-patch test fixtures)
  '''^tools/src/platform-patch/fixtures(/|$)''',
  # integrity hashes of the root workspace and the Renovate CLI project
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)node_modules(/|$)''',
  '''(^|/)src-tauri/(target|gen|icons)(/|$)''',
  '''(^|/)dist(/|$)''',
  '''^\.tmp(/|$)''',
  '''(^|/)public/audio(/|$)''',
  # build output of our own Tauri plugins (copied Tauri API, generated permissions, Gradle, SwiftPM)
  '''^plugins/[^/]+/(\.tauri|android/build|android/\.gradle|ios/\.build|permissions/(autogenerated|schemas))(/|$)''',
]
