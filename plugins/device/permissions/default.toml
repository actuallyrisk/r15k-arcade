# R15K Arcade – default permission set of the "device" plugin: exactly its three commands. The
# allow-* permissions themselves are generated by the plugin's build script into
# permissions/autogenerated/.
[default]
description = "Immersive mode, keep-awake and move to background for the R15K Arcade main window."
permissions = ["allow-set-immersive", "allow-set-keep-awake", "allow-move-to-background"]
